name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: build
        run: go build -o bin/momus ./cmd/momus
      - name: smoke test
        run: |
          go run ./examples/vulnerable-echo &
          sleep 1
          # JSON + SARIF + HTML outputs all produced from one scan.
          ./bin/momus scan http://localhost:8000 --pack packs/core \
            --json --sarif momus.sarif --html momus-report.html > findings.json
          test -s findings.json
          test -s momus.sarif
          test -s momus-report.html
          # SARIF must be valid JSON and declare version 2.1.0.
          python3 -c "import json,sys; d=json.load(open('momus.sarif')); assert d['version']=='2.1.0', d.get('version'); assert d['runs'][0]['tool']['driver']['name']=='Momus'; print('SARIF ok:', len(d['runs'][0]['results']), 'results')"
      - name: fail-on gating exits non-zero
        run: |
          go run ./examples/vulnerable-echo &
          sleep 1
          if ./bin/momus scan http://localhost:8000 --pack packs/core --fail-on high >/dev/null 2>&1; then
            echo "expected non-zero exit from --fail-on high against the vulnerable target"; exit 1
          fi
          echo "fail-on gating works"
      - name: safe target passes fail-on
        run: |
          go run ./examples/safe-echo &
          sleep 1
          ./bin/momus scan http://localhost:8001 --pack packs/core --fail-on any
          echo "safe target passes gating"

      # The evidence store exists to gate CI on regressions, so the gate itself
      # is exercised here. Both directions matter: an unchanged target must NOT
      # fail the build, and a target that newly fails an attack MUST.
      - name: regression diff gating
        run: |
          go run ./examples/safe-echo &
          go run ./examples/vulnerable-echo &
          sleep 2

          # Two identical scans of the same target: nothing changed, so the gate
          # must pass. A false regression here would make the feature unusable.
          ./bin/momus scan http://localhost:8000 --pack packs/core --store ci.db >/dev/null
          ./bin/momus scan http://localhost:8000 --pack packs/core --store ci.db >/dev/null
          ./bin/momus diff --store ci.db --target http://localhost:8000 --fail-on-regression
          echo "unchanged target does not trip the regression gate"

          # A safe baseline compared against the vulnerable target: every attack
          # that now succeeds is a regression, so the gate must trip (exit 2).
          ./bin/momus scan http://localhost:8001 --pack packs/core --store ci.db >/dev/null
          SAFE_RUN=$(./bin/momus history --store ci.db --target http://localhost:8001 --limit 1 | awk 'NR==2 {print $1}')
          VULN_RUN=$(./bin/momus history --store ci.db --target http://localhost:8000 --limit 1 | awk 'NR==2 {print $1}')
          test -n "$SAFE_RUN" && test -n "$VULN_RUN"
          if ./bin/momus diff --store ci.db --base "$SAFE_RUN" --head "$VULN_RUN" --fail-on-regression >/dev/null 2>&1; then
            echo "expected exit 2 from --fail-on-regression when attacks newly succeed"; exit 1
          fi
          echo "regression gating works"

          # A partial run must never look like a pile of fixes: the attacks that
          # did not run are unknown, not passing.
          ./bin/momus scan http://localhost:8000 --pack packs/core --store ci.db \
            --limit 3 --category jailbreak >/dev/null
          ./bin/momus diff --store ci.db --target http://localhost:8000 > diff.txt
          grep -q "0 fixed" diff.txt
          grep -q "unknown, not safe" diff.txt
          echo "partial runs are not reported as fixes"

  # Exercise the npm wrapper so asset-name drift or a broken launcher can't ship
  # silently. Uses a locally built binary via MOMUS_BINARY (no release needed).
  npm-wrapper:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: build momus and install it through the npm wrapper
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/momus" ./cmd/momus
          cd packages/momus-node
          MOMUS_BINARY="$RUNNER_TEMP/momus" node install.js
          node bin/momus.js --version
          node bin/momus.js pack verify        # verifies the embedded pack
      - name: the installer must resolve this platform's release asset name
        shell: bash
        run: node .github/scripts/check-asset-name.js

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: build docs site
        working-directory: website
        run: |
          npm install --no-audit --no-fund
          npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      # v8 installs golangci-lint v2. v6 caps at v1.x, whose released binaries
      # are built with Go 1.24 and refuse to load a config targeting Go 1.25:
      # "the Go language version used to build golangci-lint is lower than the
      # targeted Go version". Pinned to a minor series rather than `latest` so a
      # new linter release cannot turn CI red without a commit here.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
