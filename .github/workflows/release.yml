name: Release

# Tagging v* builds the cross-platform binaries and publishes them to a GitHub
# release. The npm package (`npx momus`) downloads those exact assets and checks
# them against checksums.txt, so this workflow must run BEFORE `npm publish`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release
  id-token: write # keyless cosign signing of checksums.txt

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: verify the attack pack is intact before releasing
        # Build OUTSIDE the work tree: goreleaser refuses to release from a dirty
        # git tree, and an untracked ./momus binary here would abort every release.
        run: |
          go build -o "$RUNNER_TEMP/momus" ./cmd/momus
          "$RUNNER_TEMP/momus" validate packs/core
          "$RUNNER_TEMP/momus" pack verify packs/core
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "work tree is dirty; goreleaser would abort"; exit 1; }

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: confirm the npm installer can find its asset
        run: |
          # The installer resolves its platform binary out of checksums.txt;
          # fail the release if the expected names are missing.
          for want in momus_linux_amd64 momus_darwin_arm64 momus_windows_amd64; do
            grep -q "$want" dist/checksums.txt || {
              echo "release is missing $want — npx momus would fail"; exit 1; }
          done
          echo "release assets look correct"

  # npm publishes only AFTER the binaries exist, and takes its version from the
  # tag — publishing first (or with a mismatched version) makes every install 404.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: set package version from the tag
        working-directory: packages/momus-node
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "publishing momus@$VERSION"

      - name: assert the release assets are actually downloadable
        working-directory: packages/momus-node
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/checksums.txt"
          code=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          [ "$code" = "200" ] || { echo "checksums.txt not published ($code) — refusing to publish npm"; exit 1; }

      - name: smoke-test the installer against the real release
        working-directory: packages/momus-node
        run: |
          node install.js
          node bin/momus.js --version

      # A prerelease tag (v1.2.3-rc.1) must NOT become the `latest` dist-tag, or
      # every `npx momus` user is silently upgraded onto a release candidate.
      - name: publish (prereleases go to the `next` tag)
        working-directory: packages/momus-node
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            echo "prerelease $VERSION -> dist-tag next"
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
