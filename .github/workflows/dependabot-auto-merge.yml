name: Dependabot auto-merge

# Dependency PRs that share go.mod conflict with each other pairwise: merging
# one invalidates the rest, so they have to be rebased in sequence. Auto-merge
# makes GitHub do that instead of a person.
#
# Scope is deliberate. This is a security tool, and auto-merging is a path for a
# compromised release to land without anyone reading it, so only patch and minor
# updates qualify. A major bump waits for a human — those are the ones that
# change behaviour, and the ones worth the interruption.
#
# Auto-merge does not bypass anything: GitHub still waits for every required
# check, and a red CI leaves the PR sitting open.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a major update for a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not auto-merged. A major is where behaviour changes, so this one wants a person to read it."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
