run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert

issues:
  exclude-rules:
    # Table-driven tests get long; don't nag about it.
    - path: _test\.go
      linters:
        - errcheck
